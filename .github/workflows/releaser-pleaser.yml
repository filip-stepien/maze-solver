name: releaser-pleaser

on:
  push:
    branches: [main]
  pull_request_target:
    types: [edited, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: apricote/releaser-pleaser@v0.9.0
        with:
          updaters: packagejson

      - if: github.event_name == 'push'
        uses: actions/checkout@v4

      - if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: github.event_name == 'push'
        run: npm ci && npm run start

      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null) || exit 0
          gh release upload "$tag" dist/index.html --clobber
